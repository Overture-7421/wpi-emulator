name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "tools/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "tools/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: pins
        name: Read Python pin
        run: echo "python=$(python3 -c 'import json; print(json.load(open("versions.json"))["python"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Python infrastructure regression tests
        run: python -m unittest discover -s tools/tests -v
      - name: Canonical documentation and versions
        run: |
          python tools/check_docs.py
          python tools/check_versions.py
