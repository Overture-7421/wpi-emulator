name: Release

# Builds the three distributables and attaches them to a GitHub release:
#   Windows  wpi-emulator-<ver>-windows-x64.exe (NSIS installer) + .zip (portable)
#   macOS    wpi-emulator-<ver>-macos-arm64-x64.dmg (universal; signed + notarized when the Apple secrets exist)
#   Linux    wpi-emulator-<ver>-linux-x86_64.AppImage
# See docs/packaging.md for the design, the secrets, and how to run each step locally.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      allow_stub_extension:
        description: "Allow packaging when the WPILib HAL could not be fetched (the halsim extension is then a stub that refuses to load)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  WPILIB_VERSION: "2026.2.1"   # must match WPIEMU_WPILIB_VERSION in halsim_ext/cmake/WpiEmuWpilib.cmake
  QT_QPA_PLATFORM: offscreen
  ALLOW_STUB_EXTENSION: ${{ inputs.allow_stub_extension && 'true' || 'false' }}

jobs:
  preflight:
    name: Check tag against project version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          project="$(sed -n '/^project(/,/)/{s/^ *VERSION \([0-9][0-9.]*\).*/\1/p}' CMakeLists.txt | head -n1)"
          tag="${GITHUB_REF_NAME#v}"
          echo "project version: $project, tag: $tag"
          test -n "$project"
          test "$project" = "${tag%%-*}"

  package:
    name: package (${{ matrix.name }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-2022, qt_arch: win64_msvc2022_64 }
          - { name: linux, os: ubuntu-22.04, qt_arch: "" }   # oldest supported glibc for the AppImage and the extension
          - { name: macos, os: macos-14, qt_arch: "" }       # Apple Silicon; see docs/packaging.md for universal builds
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}                       # base64 of the Developer ID .p12
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}                   # "Developer ID Application: Name (TEAMID)"
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}                     # app-specific password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Architecture boundary check
        run: python tools/check_boundaries.py --root .

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-shape0 libxcb-xkb1 libegl1 libvulkan-dev libfontconfig1 \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev \
            libudev-dev libasound2-dev desktop-file-utils file

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and
              -not (Get-Command makensis -ErrorAction SilentlyContinue)) { throw "NSIS is not available" }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qtquick3d qtshadertools
          cache: true

      - name: Cache WPILib downloads
        uses: actions/cache@v4
        with:
          path: build/release/_wpilib/downloads
          key: wpilib-${{ env.WPILIB_VERSION }}-${{ matrix.name }}

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            gen=(-G "Visual Studio 17 2022" -A x64)
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # Universal binary: arm64 + x86_64 slices; WPILib's osxuniversal libraries and the official Qt kit are universal.
            gen=(--preset macos -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64")
          else
            gen=(-G "Ninja Multi-Config")
          fi
          cmake -S . -B build/release "${gen[@]}" \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR//\\//}" \
            -DWPIEMU_BUILD_TESTS=ON \
            -DWPIEMU_WPILIB_DOWNLOAD=ON \
            -DWPIEMU_RUNVIEW_FETCH_SDL2=ON 2>&1 | tee configure.log

      # Never ship a halsim_wpiemu stub by accident (WPILib download failed => the extension refuses to load).
      - name: Require the real HALSim extension
        shell: bash
        run: |
          if grep -q "halsim_wpiemu is built with HAL support" configure.log; then
            echo "WPILib HAL found: the extension is the real one"
          elif [ "$ALLOW_STUB_EXTENSION" = "true" ]; then
            echo "::warning::WPILib HAL not found; packaging a STUB halsim_wpiemu (allow_stub_extension=true)"
          else
            echo "::error::WPILib HAL was not found, halsim_wpiemu would be a stub. Re-run with allow_stub_extension to override."
            exit 1
          fi

      - name: Build
        run: cmake --build build/release --config Release --parallel

      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure

      # ---------------------------------------------------------------- Windows
      - name: Package (NSIS installer + ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: build/release
        run: cpack -C Release -B "$PWD/pkg"

      - name: Verify the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem build/release/pkg -Filter *.exe | Select-Object -First 1).FullName
          $dest = Join-Path $env:RUNNER_TEMP 'wpiemu-installed'
          $p = Start-Process $installer -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          # System PATH only: proves the Qt runtime is deployed with the app and not picked up from the runner's Qt.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$dest\bin\wpiemu_app.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "wpiemu_app --version failed ($LASTEXITCODE)" }
          foreach ($f in 'extensions\halsim_wpiemu.dll', 'plugins\platforms\qwindows.dll', 'plugins\imageformats\qsvg.dll',
                         'plugins\iconengines\qsvgicon.dll', 'qml\QtQuick3D\qquick3dplugin.dll', 'bin\qt.conf') {
            if (-not (Test-Path "$dest\$f")) { throw "missing in installed tree: $f" }
          }
          Start-Process "$dest\Uninstall.exe" -ArgumentList '/S', "_?=$dest" -Wait

      # ---------------------------------------------------------------- macOS
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          keychain="$RUNNER_TEMP/wpiemu-signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "WPIEMU_CODESIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "WPIEMU_CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package (dmg)
        if: runner.os == 'macOS'
        working-directory: build/release
        run: cpack -C Release -G DragNDrop -B "$PWD/pkg"

      - name: Notarize
        if: runner.os == 'macOS'
        run: |
          for dmg in build/release/pkg/*.dmg; do bash packaging/macos/notarize.sh "$dmg"; done

      - name: Verify the dmg
        if: runner.os == 'macOS'
        run: |
          dmg="$(ls build/release/pkg/*.dmg | head -n1)"
          mount="$RUNNER_TEMP/wpiemu-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly
          app="$mount/wpiemu_app.app"
          python packaging/macos/check_minimum_os.py "$app"
          env -i PATH=/usr/bin:/bin "$app/Contents/MacOS/wpiemu_app" --version
          # Both slices must be present in the app, the extension and every bundled framework/dylib that has any slice.
          for f in "$app/Contents/MacOS/wpiemu_app" "$app/Contents/PlugIns/wpiemu/libhalsim_wpiemu.dylib"; do
            archs="$(lipo -archs "$f")"
            echo "$f: $archs"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::$f is not universal ($archs)"; exit 1 ;; esac
          done
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            env -i PATH=/usr/bin:/bin arch -x86_64 "$app/Contents/MacOS/wpiemu_app" --version
          else
            echo "::notice::Rosetta is not available on this runner; the x86_64 slice was not executed"
          fi
          test -f "$app/Contents/PlugIns/wpiemu/libhalsim_wpiemu.dylib"
          find "$app/Contents/Resources/qml/QtQuick3D" -iname '*quick3dplugin*' -print -quit | grep -q .
          exe="$app/Contents/MacOS/wpiemu_app"
          # Fat binaries print "<exe> (architecture ...):" headers; only the tab-indented lines are dependencies.
          bad="$(otool -arch all -L "$exe" | grep -E '^[[:space:]]' | awk '{print $1}' | grep -v -E '^(@rpath|@executable_path|@loader_path|/usr/lib/|/System/)' || true)"
          if [ -n "$bad" ]; then echo "::error::unbundled dependencies:"; echo "$bad"; exit 1; fi
          hdiutil detach "$mount"

      # ---------------------------------------------------------------- Linux
      - name: Package (AppImage)
        if: runner.os == 'Linux'
        env:
          BUILD_DIR: ${{ github.workspace }}/build/release
          OUT_DIR: ${{ github.workspace }}/build/release/pkg
          SKIP_BUILD: "1"
        run: bash packaging/linux/build-appimage.sh

      # All signing and stapling must precede this final digest generation/verification.
      - name: Final artifact checksums
        run: |
          python tools/package_checksums.py build/release/pkg
          python tools/package_checksums.py build/release/pkg --verify

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpi-emulator-${{ matrix.name }}
          path: |
            build/release/pkg/*.exe
            build/release/pkg/*.zip
            build/release/pkg/*.dmg
            build/release/pkg/*.AppImage
            build/release/pkg/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "WPI Emulator $GITHUB_REF_NAME" --generate-notes --draft $prerelease
