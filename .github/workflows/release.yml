name: Release

# Builds the three distributables and drafts a GitHub release for the version typed into "Run workflow":
#   Windows  wpi-emulator-<ver>-windows-x64.exe (NSIS installer) + .zip (portable)
#   macOS    wpi-emulator-<ver>-macos-arm64-x64.dmg (universal; signed + notarized when the Apple secrets exist)
#   Linux    wpi-emulator-<ver>-linux-x86_64.AppImage
# The committed project version (0.0.0) is a placeholder: every build job rewrites it in its own checkout, so nothing
# is pushed to main. Only a run on main drafts the release; other refs just upload the artifacts.
# See docs/releasing.md for the design, the secrets, and how to run each step locally.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.0.8 (a suffix such as -rc1 makes it a prerelease)"
        type: string
        required: true
      allow_stub_extension:
        description: "Allow packaging when the WPILib HAL could not be fetched (the halsim extension is then a stub that refuses to load)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  QT_QPA_PLATFORM: offscreen
  ALLOW_STUB_EXTENSION: ${{ inputs.allow_stub_extension && 'true' || 'false' }}

jobs:
  prepare:
    name: Check the release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every tag, to reject a version that exists or is lower than the latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: resolve
        name: Validate the version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          git tag --list 'v*' > "$RUNNER_TEMP/tags.txt"
          python tools/release_version.py resolve "$VERSION_INPUT" --tags-file "$RUNNER_TEMP/tags.txt" --github-output
      - name: Note that no release will be drafted
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::notice::Run from ${GITHUB_REF_NAME}, not main. The artifacts are uploaded but no release is drafted."

  package:
    name: package (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-2025-vs2026, qt_arch: win64_msvc2022_64 }
          - { name: linux, os: ubuntu-24.04, qt_arch: "" }   # glibc supports all season WPILib binaries
          - { name: macos, os: macos-14, qt_arch: "" }       # Apple Silicon; see docs/releasing.md for universal builds
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}                       # base64 of the Developer ID .p12
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}                   # "Developer ID Application: Name (TEAMID)"
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}                     # app-specific password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only this job's checkout changes; the committed placeholder stays in git.
      - name: Apply the release version
        shell: bash
        run: python tools/release_version.py apply "$RELEASE_VERSION"

      - name: Architecture boundary check
        run: python tools/check_boundaries.py --root .

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-shape0 libxcb-xkb1 libegl1 libvulkan-dev libfontconfig1 \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev \
            libudev-dev libasound2-dev desktop-file-utils file

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and
              -not (Get-Command makensis -ErrorAction SilentlyContinue)) { throw "NSIS is not available" }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qtquick3d qtshadertools qtmultimedia
          cache: true

      - name: Cache WPILib downloads
        uses: actions/cache@v4
        with:
          path: |
            build/release/_wpilib/downloads
            build/release/seasons/*/_wpilib/downloads
          key: wpilib-multi-${{ hashFiles('seasons/*/season.json') }}-${{ matrix.name }}

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            gen=(-G "Visual Studio 18 2026" -A x64)
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # Universal binary: arm64 + x86_64 slices; WPILib's osxuniversal libraries and the official Qt kit are universal.
            gen=(--preset macos -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64")
          else
            gen=(-G "Ninja Multi-Config")
          fi
          cmake -S . -B build/release "${gen[@]}" \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR//\\//}" \
            -DWPIEMU_BUILD_TESTS=ON \
            -DWPIEMU_SEASONS=all \
            -DWPIEMU_WARNINGS_AS_ERRORS=ON \
            -DWPIEMU_WPILIB_DOWNLOAD=ON \
            -DWPIEMU_RUNVIEW_FETCH_SDL2=ON 2>&1 | tee configure.log

      # Never ship a halsim_wpiemu stub by accident (WPILib download failed => the extension refuses to load).
      - name: Require the real HALSim extension
        shell: bash
        run: |
          if grep -q "halsim_wpiemu is built with HAL support" configure.log; then
            echo "WPILib HAL found: the extension is the real one"
          elif [ "$ALLOW_STUB_EXTENSION" = "true" ]; then
            echo "::warning::WPILib HAL not found; packaging a STUB halsim_wpiemu (allow_stub_extension=true)"
          else
            echo "::error::WPILib HAL was not found, halsim_wpiemu would be a stub. Re-run with allow_stub_extension to override."
            exit 1
          fi

      - name: Build
        run: cmake --build build/release --config Release --parallel

      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure

      # ---------------------------------------------------------------- Windows
      - name: Package (NSIS installer + ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: build/release
        run: cpack -C Release -B "$PWD/pkg"

      - name: Verify the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem build/release/pkg -Filter *.exe | Select-Object -First 1).FullName
          $dest = Join-Path $env:RUNNER_TEMP 'wpiemu-installed'
          $p = Start-Process $installer -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          # System PATH only: proves the Qt runtime is deployed with the app and not picked up from the runner's Qt.
          $files = @(python tools/seasons.py extensions --layout windows) + @('plugins\platforms\qwindows.dll', 'plugins\imageformats\qsvg.dll',
                         'plugins\iconengines\qsvgicon.dll', 'plugins\multimedia\ffmpegmediaplugin.dll',
                         'plugins\tls\qschannelbackend.dll',   # HTTPS of the in-app updater
                         'qml\QtQuick3D\qquick3dplugin.dll', 'bin\qt.conf')
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$dest\bin\wpiemu_app.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "wpiemu_app --version failed ($LASTEXITCODE)" }
          $files = @(python tools/seasons.py extensions --layout windows) + @('plugins\platforms\qwindows.dll', 'plugins\imageformats\qsvg.dll',
                         'plugins\iconengines\qsvgicon.dll', 'plugins\multimedia\ffmpegmediaplugin.dll',
                         'plugins\tls\qschannelbackend.dll',   # HTTPS of the in-app updater
                         'qml\QtQuick3D\qquick3dplugin.dll', 'bin\qt.conf')
          foreach ($f in $files) {
            if (-not (Test-Path "$dest\$f")) { throw "missing in installed tree: $f" }
          }
          # The downloaded Java gets this runtime when its own is too old (WPILib needs msvcp140 >= versions.json msvcRuntimeMin).
          $min = [version](Get-Content versions.json -Raw | ConvertFrom-Json).msvcRuntimeMin
          $runtime = [version](Get-Item "$dest\bin\msvcp140.dll").VersionInfo.ProductVersion
          if ($runtime -lt $min) { throw "bin\msvcp140.dll is $runtime, older than the $min WPILib needs" }
          Start-Process "$dest\Uninstall.exe" -ArgumentList '/S', "_?=$dest" -Wait

      # ---------------------------------------------------------------- macOS
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          keychain="$RUNNER_TEMP/wpiemu-signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "WPIEMU_CODESIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "WPIEMU_CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package (dmg)
        if: runner.os == 'macOS'
        working-directory: build/release
        run: cpack -C Release -G DragNDrop -B "$PWD/pkg"

      - name: Notarize
        if: runner.os == 'macOS'
        run: |
          for dmg in build/release/pkg/*.dmg; do bash packaging/macos/notarize.sh "$dmg"; done

      - name: Verify the dmg
        if: runner.os == 'macOS'
        run: |
          dmg="$(ls build/release/pkg/*.dmg | head -n1)"
          mount="$RUNNER_TEMP/wpiemu-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly
          app="$mount/wpiemu_app.app"
          python packaging/macos/check_minimum_os.py "$app"
          env -i PATH=/usr/bin:/bin "$app/Contents/MacOS/wpiemu_app" --version
          # Both slices must be present in the app, the extension and every bundled framework/dylib that has any slice.
          extensions=()
          while IFS= read -r f; do extensions+=("$app/$f"); done < <(python tools/seasons.py extensions --layout macos-bundle)
          for f in "$app/Contents/MacOS/wpiemu_app" "${extensions[@]}"; do
            archs="$(lipo -archs "$f")"
            echo "$f: $archs"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::$f is not universal ($archs)"; exit 1 ;; esac
          done
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            env -i PATH=/usr/bin:/bin arch -x86_64 "$app/Contents/MacOS/wpiemu_app" --version
          else
            echo "::notice::Rosetta is not available on this runner; the x86_64 slice was not executed"
          fi
          for f in "${extensions[@]}"; do test -f "$f"; done
          find "$app/Contents/Resources/qml/QtQuick3D" -iname '*quick3dplugin*' -print -quit | grep -q .
          find "$app/Contents/PlugIns/multimedia" -iname '*ffmpegmediaplugin*' -print -quit | grep -q .
          find "$app/Contents/PlugIns/tls" -iname '*backend*' -print -quit | grep -q .   # HTTPS of the in-app updater
          exe="$app/Contents/MacOS/wpiemu_app"
          # Fat binaries print "<exe> (architecture ...):" headers; only the tab-indented lines are dependencies.
          bad="$(otool -arch all -L "$exe" | grep -E '^[[:space:]]' | awk '{print $1}' | grep -v -E '^(@rpath|@executable_path|@loader_path|/usr/lib/|/System/)' || true)"
          if [ -n "$bad" ]; then echo "::error::unbundled dependencies:"; echo "$bad"; exit 1; fi
          hdiutil detach "$mount"

      # ---------------------------------------------------------------- Linux
      - name: Package (AppImage)
        if: runner.os == 'Linux'
        env:
          BUILD_DIR: ${{ github.workspace }}/build/release
          OUT_DIR: ${{ github.workspace }}/build/release/pkg
          SKIP_BUILD: "1"
        run: bash packaging/linux/build-appimage.sh

      # All signing and stapling must precede this final digest generation/verification.
      - name: Final artifact checksums
        run: |
          python tools/package_checksums.py build/release/pkg
          python tools/package_checksums.py build/release/pkg --verify

      # The installer names come from the version the build used: they prove the release version took effect.
      - name: Installers carry the release version
        run: python tools/release_version.py artifacts build/release/pkg "$RELEASE_VERSION"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpi-emulator-${{ matrix.name }}
          path: |
            build/release/pkg/*.exe
            build/release/pkg/*.zip
            build/release/pkg/*.dmg
            build/release/pkg/*.AppImage
            build/release/pkg/*.sha256
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: [prepare, package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # A draft holds no tag yet, so look for one by name: a stale draft of this version must be deleted first.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep -Fxq "$TAG"; then
            echo "::error::A release for $TAG already exists (possibly a stale draft). Delete it and run again."
            exit 1
          fi
          prerelease=""
          if [ "$PRERELEASE" = "true" ]; then prerelease="--prerelease"; fi
          # GitHub creates the tag at this exact commit when the draft is published.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "WPI Emulator $TAG" --generate-notes --draft $prerelease
