// Command-line init script (gradlew -I wpiemu-init.gradle simulateJava|simulateNative): makes GradleRIO's
// simulation tasks load halsim_wpiemu without touching the robot project (ADR 0001). The emulator's launcher
// generates the production equivalent; this copy exists for the manual end-to-end test.
//
// GradleRIO overwrites HALSIM_EXTENSIONS when a default-enabled extension (the stock Sim GUI) exists, so the
// defaults are switched off first and the variable is then set on every simulation task.
def emuExt = System.getenv('WPIEMU_EXT')   // absolute path of halsim_wpiemu.{dll,so,dylib}
allprojects { p ->
    p.afterEvaluate {
        def wpi = p.extensions.findByName('wpi')
        if (wpi == null || emuExt == null) return
        wpi.sim.halExtensions.each { it.defaultEnabled.set(false) }
        p.tasks.matching {
            def n = it.class.name   // GradleRIO's task classes carry a _Decorated suffix
            n.startsWith('edu.wpi.first.gradlerio.simulation.JavaSimulationTask') ||
            n.startsWith('edu.wpi.first.gradlerio.simulation.NativeSimulationTask')
        }.configureEach { t -> t.environment('HALSIM_EXTENSIONS', emuExt) }
    }
}
